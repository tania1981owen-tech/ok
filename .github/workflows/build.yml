name: Automated Windows Build

# Сборка будет запускаться при каждом обновлении кода или вручную кнопкой
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    # Запускаем чистую Windows-машину с установленной Visual Studio
    runs-on: windows-latest

    steps:
    # 1. Робот скачивает ваш код (Tervylla.vcxproj и все исходники)
    - name: Clone repository
      uses: actions/checkout@v4

    # 2. Робот находит на сервере инструменты Visual Studio (MSBuild)
    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # 3. Полная чистая пересборка проекта во избежание пропуска файлов компилятором
    # [ИСПРАВЛЕНО] Добавлен флаг /t:Rebuild для принудительной генерации бинарников
    - name: Compile Project
      run: msbuild Tervylla.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform="x64" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

    # 4. Робот забирает готовые файлы (.exe или .dll) и упаковывает их для вас
    # [ИСПРАВЛЕНО] Пути настроены строго под папки генерации из логов MSBuild
    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          D:/a/ok/ok/x64/Release/*.exe
          D:/a/ok/ok/x64/Release/*.dll
          Tervylla/x64/Release/*.exe
          Tervylla/x64/Release/*.dll
          **/x64/Release/*.exe
          **/x64/Release/*.dll
