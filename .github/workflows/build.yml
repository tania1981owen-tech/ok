name: Automated Windows Build

# Сборка будет запускаться при каждом обновлении кода или вручную кнопкой
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    # Запускаем чистую Windows-машину с установленной Visual Studio
    runs-on: windows-latest

    steps:
    # 1. Робот скачивает ваш код (Tervylla.vcxproj и все исходники)
    - name: Clone repository
      uses: actions/checkout@v4

    # 2. Робот находит на сервере инструменты Visual Studio (MSBuild)
    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # 3. Компиляция проекта строго во временную папку сборщика
    # [ИСПРАВЛЕНО] Добавлен флаг OutputDirectory (OutDir), принудительно сохраняющий результат в корень сборки
    - name: Compile Project
      run: msbuild Tervylla.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform="x64" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:OutDir="${{ github.workspace }}/build_output/"

    # 4. Робот забирает файлы из нашей фиксированной папки
    # [ИСПРАВЛЕНО] Путь теперь намертво привязан к build_output
    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          build_output/*.exe
          build_output/*.dll
          build_output/**/*.exe
          build_output/**/*.dll
