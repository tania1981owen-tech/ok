name: Automated Windows Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # Собираем проект и сразу же консольной командой Windows (copy) вытаскиваем получившуюся DLL в корень репозитория
    - name: Compile Project
      run: |
        msbuild Tervylla.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform="x64" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
        copy D:\a\ok\ok\x64\Release\Tervylla.dll Tervylla.dll

    # [ИСПРАВЛЕНО] Забираем файл прямо из корня проекта, тут робот не сможет промахнуться
    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: Tervylla.dll
