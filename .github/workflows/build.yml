name: Automated Windows Build

# Сборка будет запускаться при каждом обновлении кода или вручную кнопкой
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    # Запускаем чистую Windows-машину с установленной Visual Studio
    runs-on: windows-latest

    steps:
    # 1. Робот скачивает ваш код (Tervylla.vcxproj и все исходники)
    - name: Clone repository
      uses: actions/checkout@v4

    # 2. Робот находит на сервере инструменты Visual Studio (MSBuild)
    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # 3. [ИСПРАВЛЕНО] Автоматически обновляем сам файл проекта до актуальной версии инструментов сборки на сервере GitHub
    - name: Retarget Project to Current Toolset
      run: msbuild Tervylla.vcxproj /t:Upgrade

    # 4. Самый главный шаг: Сборка конкретного vcxproj файла в режиме Release под x64
    # [ИСПРАВЛЕНО] Убрана зависимость от отсутствующего .sln, добавлена сборка конкретного проекта
    - name: Compile Project
      run: msbuild Tervylla.vcxproj /p:Configuration=Release /p:Platform="x64" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

    # 5. Робот забирает готовые файлы (.exe или .dll) и упаковывает их для вас
    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          **/Release/**/*.exe
          **/Release/**/*.dll
          x64/Release/**/*.exe
          x64/Release/**/*.dll
